name: Secret scan

# Phase 2 guardrail. Runs gitleaks on every PR diff. The integrate
# sealer (.github/workflows/integrate.yml) refuses to auto-merge a PR
# whose `Secret scan` check is `fail`, so a hit here blocks merge
# without any further wiring.
#
# Scope: PRs only. We do not run on push to main because main is gated
# behind PRs in this repo (see CLAUDE.md invariants), so a scan there
# would be redundant and would burn Actions minutes on every state /
# ledger commit if those branches ever did target main.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # gitleaks --log-opts needs the full history

      - name: Run gitleaks on PR diff
        id: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Pin gitleaks to a known-good release. Update intentionally.
          GL_VERSION="8.18.4"
          curl -sSL -o /tmp/gl.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          mkdir -p /tmp/gl && tar -xzf /tmp/gl.tgz -C /tmp/gl
          /tmp/gl/gitleaks detect \
            --no-banner \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --exit-code 1 || rc=$?
          rc=${rc:-0}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::gitleaks found potential secrets in this PR's diff."
          fi
          exit "$rc"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

      - name: Comment on PR (on hit)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          summary=$(jq -r '
            map("- **" + (.RuleID // "rule") + "** in `" + (.File // "?") + "`")
            | unique
            | .[0:20]
            | join("\n")
          ' gitleaks-report.json 2>/dev/null || echo "")
          body=$(printf 'Secret scan flagged %s potential leaks in this diff. See the gitleaks-report artifact on this run for details. Merge is blocked until this is resolved.\n\n%s\n' \
            "$(jq 'length' gitleaks-report.json 2>/dev/null || echo unknown)" \
            "$summary")
          gh pr comment "$PR" --body "$body" || true
          gh pr edit  "$PR" --add-label "needs-human" || true
