name: Factory recurring jobs

# Hourly tick that evaluates .factory/schedule.yml and files any
# recurring WorkItem that is due. State is tracked in
# schedule-state.json on the factory state branch (default
# factory/state) so the next tick doesn't double-fire.
#
# This workflow does NOT run the factory itself — it only files
# issues. The operator's next /factory-tick session triages and
# advances them through the normal pipeline.

on:
  schedule:
    - cron: '0 * * * *'   # hourly, top of the hour UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print decisions without filing issues"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

concurrency:
  group: factory-recurring-jobs
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pyyaml
        run: python3 -m pip install --quiet pyyaml

      - name: Run schedule tick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            scripts/factory/schedule-tick.sh --dry-run
          else
            scripts/factory/schedule-tick.sh
          fi
