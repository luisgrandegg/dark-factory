name: Factory daily report

# Posts a daily summary of the factory's activity as a GitHub issue.
# Combines scripts/factory/metrics.sh (per-station latency / success
# rate) and scripts/factory/failures.sh (top failure reasons + top
# affected WorkItems) over the last 24h.
#
# Schedule fires at 14:00 UTC; workflow_dispatch lets the operator
# trigger an ad-hoc run. Re-runs on the same UTC day produce a fresh
# issue (the report is meant to be a daily timeline, not a live
# document).
#
# Falls back gracefully when the factory/ledger branch does not yet
# exist (fresh template) — emits a single-line "no ledger yet" note
# instead of failing the workflow.

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: "Window in days (default 1)"
        required: false
        default: "1"

permissions:
  contents: read
  issues: write

concurrency:
  group: factory-daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (for scripts)
        uses: actions/checkout@v4

      - name: Checkout factory/ledger
        id: ledger
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: factory/ledger
          path: ledger

      - name: Build report body
        id: build
        env:
          DAYS: ${{ inputs.days || '1' }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          out=/tmp/daily-report.md
          {
            echo "# Factory daily — $today"
            echo
            if [[ "${{ steps.ledger.outcome }}" != "success" || ! -d ledger/runs ]]; then
              echo "_No \`factory/ledger\` branch yet — nothing to report._"
            else
              scripts/factory/metrics.sh  --ledger-dir ledger --days "$DAYS" --format md
              echo
              scripts/factory/failures.sh --ledger-dir ledger --days "$DAYS" --format md
            fi
            echo
            echo "_Generated by .github/workflows/daily-report.yml on $(date -u --iso-8601=seconds)._"
          } > "$out"
          {
            echo "title=Factory daily — $today"
            echo "body_path=$out"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure factory:report label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create factory:report \
            --color c5def5 \
            --description "Factory daily / weekly report" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

      - name: Open report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE:   ${{ steps.build.outputs.title }}
          BODY_PATH: ${{ steps.build.outputs.body_path }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body-file "$BODY_PATH" \
            --label "factory:report"
