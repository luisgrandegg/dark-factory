name: Integrate

# Auto-merge sealer (ADR 0001). The orchestrator session never merges PRs
# directly. Instead, the review subagent transitions a passing PR to
# `stage:integrate`; this workflow watches for that label, verifies CI is
# green, checks no approval-gate path was touched, and enables auto-merge.
#
# This is the only Actions workflow that mutates merge state.

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  seal:
    if: |
      github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'stage:integrate')
      || github.event_name == 'check_suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Resolve target PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            # check_suite carries no PR; find PRs the suite ran for.
            prs=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.check_suite.head_sha }}/pulls" --jq '.[].number')
            if [[ -z "$prs" ]]; then
              echo "no PRs for this commit" >&2; exit 0
            fi
            # Take the first eligible one; multi-PR shared head is rare.
            echo "number=$(echo "$prs" | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify eligibility
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          [[ -n "$PR" ]] || { echo "no PR number"; exit 0; }

          # 1. PR is open and has stage:integrate.
          state=$(gh pr view "$PR" --json state,labels,isDraft,mergeStateStatus,headRefName)
          is_open=$(jq -r '.state == "OPEN"' <<<"$state")
          is_draft=$(jq -r '.isDraft' <<<"$state")
          has_label=$(jq -r '[.labels[].name] | index("stage:integrate") != null' <<<"$state")
          merge_state=$(jq -r '.mergeStateStatus' <<<"$state")
          if [[ "$is_open" != "true" || "$has_label" != "true" || "$is_draft" == "true" ]]; then
            echo "not eligible (open=$is_open label=$has_label draft=$is_draft)" >&2
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # 2. No approval-gate path or label trips. Patterns live in
          # .factory/policy.yml under approvalGates and are loaded
          # dynamically by scripts/factory/check-gates.sh (Phase 2).
          labels_csv=$(jq -r '[.labels[].name] | join(",")' <<<"$state")
          gate_out=$(gh pr diff "$PR" --name-only \
            | scripts/factory/check-gates.sh --labels "$labels_csv" || true)
          if [[ -n "$gate_out" ]]; then
            body=$(printf 'Auto-merge sealer: PR trips approval gates, requires human review:\n```\n%s\n```\n' "$gate_out")
            gh pr comment "$PR" --body "$body"
            gh pr edit "$PR" --add-label "needs-human" --remove-label "stage:integrate"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # 3. Secret scanning. The secret-scan workflow runs on every PR
          # (see .github/workflows/secret-scan.yml). We refuse to seal a
          # merge if it failed; "no run yet" counts as pending.
          secret_state=$(gh pr checks "$PR" --json name,state,bucket \
            --jq '[.[] | select(.name | startswith("Secret scan"))] | first // null')
          if [[ "$secret_state" == "null" ]]; then
            echo "secret-scan has not run yet; will retry on next event" >&2
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          secret_bucket=$(jq -r '.bucket // empty' <<<"$secret_state")
          if [[ "$secret_bucket" == "fail" ]]; then
            gh pr comment "$PR" --body "Auto-merge sealer: secret-scan failed; refusing to merge. Investigate the scan output before re-labelling stage:integrate."
            gh pr edit "$PR" --add-label "needs-human" --remove-label "stage:integrate"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # 4. CI is green.
          checks=$(gh pr checks "$PR" --json bucket --jq '[.[].bucket] | unique')
          if grep -qE '"fail"|"cancel"' <<<"$checks"; then
            echo "ci not green: $checks" >&2
            gh pr comment "$PR" --body "Auto-merge sealer: CI is not green: $checks"
            gh pr edit "$PR" --add-label "stage:implement" --remove-label "stage:integrate"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -q '"pending"' <<<"$checks"; then
            echo "ci still pending; will retry on next event" >&2
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Mark ready and enable auto-merge
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr ready "$PR" || true
          gh pr merge "$PR" --auto --squash --delete-branch
          gh pr edit "$PR" --add-label "stage:done" --remove-label "stage:integrate"
          gh pr comment "$PR" --body "Auto-merge sealer: queued for squash-merge."
