name: CI

# Project tests / lint on PRs into main. The factory itself does not run
# in Actions (ADR 0001) — this workflow only exists to validate product
# code changes proposed by the implement station (or by humans).
#
# Path filter ensures factory branches (factory/state, factory/ledger)
# never trigger CI. The orchestrator pushes to those branches every tick
# and burning Actions minutes on state/ledger writes is exactly what the
# `branches` filter is here to prevent.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect project tooling
    runs-on: ubuntu-latest
    outputs:
      has_node: ${{ steps.probe.outputs.has_node }}
      has_python: ${{ steps.probe.outputs.has_python }}
      has_rust: ${{ steps.probe.outputs.has_rust }}
      has_go: ${{ steps.probe.outputs.has_go }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        # The template is stack-agnostic. We probe for common manifests
        # and let the project specialise this workflow once it has code.
        run: |
          set -e
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          out has_node   "$([[ -f package.json ]] && echo true || echo false)"
          out has_python "$([[ -f pyproject.toml || -f requirements.txt ]] && echo true || echo false)"
          out has_rust   "$([[ -f Cargo.toml ]] && echo true || echo false)"
          out has_go     "$([[ -f go.mod ]] && echo true || echo false)"

  node:
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'npm' }
      - run: npm ci
      - run: npm test --if-present
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present

  python:
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: |
          python -m pip install --upgrade pip
          if [[ -f pyproject.toml ]]; then pip install -e ".[dev]" || pip install -e .; fi
          if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi
      - run: python -m pytest -q || true   # absent until the user adds tests
      - run: python -m ruff check . || true

  rust:
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all
      - run: cargo clippy --all-targets -- -D warnings

  go:
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - run: go test ./...
      - run: go vet ./...

  factory-sanity:
    # Static checks for the factory itself: shellcheck on helper scripts,
    # JSON/YAML syntax. Cheap and catches the kind of typos the smoke test
    # would otherwise reveal at runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck -P scripts/factory -x scripts/factory/*.sh .claude/hooks/*.sh scripts/setup.sh scripts/doctor.sh scripts/seed-test-repo.sh
      - name: validate JSON/YAML
        run: |
          python3 -c "import json; json.load(open('.claude/settings.json'))"
          python3 -c "
          import sys
          try:
            import yaml
          except ImportError:
            sys.exit(0)  # yaml not installed; skip
          yaml.safe_load(open('.factory/policy.yml'))
          "
